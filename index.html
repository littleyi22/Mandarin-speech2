<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國語演說評審記錄工具 - 奕鈞老師</title>
  
  <!-- 引入 Tailwind CSS 進行切版與樣式設定 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 FontAwesome 圖示庫 (替代原本的 Lucide React) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 以在瀏覽器編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }
    
    /* 給上方 Toast 訊息專用的下拉動畫 (包含強制水平置中的 translateX) */
    @keyframes fadeInDownToast {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-fade-in-down-toast {
      animation: fadeInDownToast 0.3s ease-out forwards;
    }

    /* 給 Modal 黑色半透明背景用的淡入動畫 */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    /* 給 Modal 視窗本體用的彈出縮放動畫 */
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-scale-up {
      animation: scaleUp 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-indigo-50/50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TONES = [
      { id: 'encouraging', label: '正面鼓勵' },
      { id: 'objective', label: '中肯建議' },
      { id: 'strict', label: '嚴謹叮嚀' },
      { id: 'warm', label: '溫暖感性' }
    ];

    const LENGTHS = [
      { id: 'short', label: '50-100字' },
      { id: 'medium', label: '100-150字' },
      { id: 'long', label: '150-250字' }
    ];

    const INITIAL_TAG_CATEGORIES = [
      {
        title: '內容：見解、結構、詞彙',
        strengths: ['破題新穎', '見解獨到', '切中題旨', '結構嚴謹', '層次分明', '舉例生動', '詞藻優美', '結尾有力', '引經據典', '情感真摯', '題材豐富', '說理透徹', '首尾呼應', '扣人心弦', '富有哲理'],
        weaknesses: ['偏離主題', '內容空泛', '結構鬆散', '缺乏實例', '詞彙貧乏', '邏輯跳躍', '結語草率', '深度不足', '開頭平淡', '稍嫌平鋪直敘', '主旨不明確', '結尾未呼應', '缺乏自身經驗']
      },
      {
        title: '語音：發音、語調、語氣',
        strengths: ['咬字清晰', '發音標準', '抑揚頓挫', '語調自然', '聲音宏亮', '節奏合宜', '情感充沛', '斷句精準', '音色優美', '輕重緩急得宜', '嗓音極具穿透力', '語速適中'],
        weaknesses: ['咬字不清', '語速過快', '語速過慢', '聲音微弱', '語調平淡', '贅字過多', '節奏紊亂', '換氣聲大', '尾音上揚', '聲音沙啞', '語尾含糊', '鼻音過重', '有口音', '忘詞', '停頓', 'ㄤㄢ不分', 'ㄣㄥ不分', '捲舌音不明確', '不捲舌音捲舌']
      },
      {
        title: '臺風 ：儀容、態度、表情',
        strengths: ['儀態端莊', '自信從容', '眼神交流', '表情豐富', '手勢自然', '具大將之風', '站姿挺拔', '具渲染力', '具親和力', '台風穩健', '微笑動人', '走位自然'],
        weaknesses: ['眼神游移', '肢體僵硬', '小動作多', '缺乏互動', '站姿歪斜', '過度緊張', '表情僵硬', '依賴講稿', '眼神看天花板', '站姿頻繁移動', '麥克風位置不佳', '缺乏手勢輔助']
      }
    ];

    const TOTAL_STUDENTS = 30;

    function App() {
      const [currentId, setCurrentId] = useState(1);
      const [globalSettings, setGlobalSettings] = useState({
        tone: 'encouraging',
        length: 'medium'
      });

      // 全域比賽設定
      const [minTimeLimit, setMinTimeLimit] = useState(4);
      const [maxTimeLimit, setMaxTimeLimit] = useState(5);
      
      // 全域題庫設定 (支援多題)
      const [globalTopics, setGlobalTopics] = useState([]); 
      const [newTopicInput, setNewTopicInput] = useState('');

      // 標籤庫狀態 (允許使用者編輯)
      const [tagCategories, setTagCategories] = useState(INITIAL_TAG_CATEGORIES);
      const [isEditingTags, setIsEditingTags] = useState(false);
      const [newTagInputs, setNewTagInputs] = useState({});

      // 全域自定義關鍵字
      const [globalCustomTags, setGlobalCustomTags] = useState([]);
      const [newGlobalTagInput, setNewGlobalTagInput] = useState('');

      // 隱藏的檔案上傳輸入框引用
      const fileInputRef = useRef(null);

      // 儲存所有學生的狀態
      const [studentsData, setStudentsData] = useState(
        Array.from({ length: TOTAL_STUDENTS }).map((_, idx) => ({
          id: idx + 1,
          classId: '',
          name: '',
          topic: '', 
          timeMin: '',
          timeSec: '',
          selectedTags: [],
          personalExperience: '', 
          generatedComment: ''
        }))
      );

      const [toastMessage, setToastMessage] = useState(null);
      // 新增：用來控制「請使用 AI 版」提示彈跳視窗的狀態
      const [isAiModalOpen, setIsAiModalOpen] = useState(false);

      const currentStudent = studentsData[currentId - 1];

      const updateCurrentStudent = (updates) => {
        setStudentsData(prev => prev.map(student => 
          student.id === currentId ? { ...student, ...updates } : student
        ));
      };

      const toggleTag = (tag) => {
        if (isEditingTags) return; 
        const isSelected = currentStudent.selectedTags.includes(tag);
        if (isSelected) {
          updateCurrentStudent({ selectedTags: currentStudent.selectedTags.filter(t => t !== tag) });
        } else {
          updateCurrentStudent({ selectedTags: [...currentStudent.selectedTags, tag] });
        }
      };

      const removeTagFromAllStudents = (tagToRemove) => {
        setStudentsData(prev => prev.map(student => ({
          ...student,
          selectedTags: student.selectedTags.filter(t => t !== tagToRemove)
        })));
      };

      const handleAddTopic = () => {
        const val = newTopicInput.trim();
        if (val && !globalTopics.includes(val)) {
          setGlobalTopics([...globalTopics, val]);
          setNewTopicInput('');
          showToast("已新增演說題目");
        }
      };

      const handleRemoveTopic = (topicToRemove) => {
        if (window.confirm(`確定要刪除題目「${topicToRemove}」嗎？已選取此題目的選手，其題目欄位將會清空。`)) {
          setGlobalTopics(globalTopics.filter(t => t !== topicToRemove));
          setStudentsData(prev => prev.map(student => ({
            ...student,
            topic: student.topic === topicToRemove ? '' : student.topic
          })));
        }
      };

      const handleMoveTag = (catIdx, type, tagIdx, direction) => {
        setTagCategories(prev => {
          const newCat = [...prev];
          const tags = [...newCat[catIdx][type]];
          if (tagIdx + direction < 0 || tagIdx + direction >= tags.length) return prev;
          
          const temp = tags[tagIdx];
          tags[tagIdx] = tags[tagIdx + direction];
          tags[tagIdx + direction] = temp;
          
          newCat[catIdx][type] = tags;
          return newCat;
        });
      };

      const handleRemoveTag = (catIdx, type, tagIdx) => {
        const tagToRemove = tagCategories[catIdx][type][tagIdx];
        if (window.confirm(`確定要刪除標籤「${tagToRemove}」嗎？這將會同步移除選手已選取的該標籤。`)) {
          setTagCategories(prev => {
            const newCat = [...prev];
            newCat[catIdx][type] = newCat[catIdx][type].filter((_, i) => i !== tagIdx);
            return newCat;
          });
          removeTagFromAllStudents(tagToRemove);
        }
      };

      const handleAddTag = (catIdx, type) => {
        const inputKey = `${catIdx}-${type}`;
        const val = (newTagInputs[inputKey] || '').trim();
        if (val && !tagCategories[catIdx][type].includes(val)) {
          setTagCategories(prev => {
            const newCat = [...prev];
            newCat[catIdx][type] = [...newCat[catIdx][type], val];
            return newCat;
          });
          setNewTagInputs(prev => ({ ...prev, [inputKey]: '' }));
        }
      };

      const addGlobalCustomTag = () => {
        const val = newGlobalTagInput.trim();
        if (val && !globalCustomTags.includes(val)) {
          setGlobalCustomTags([...globalCustomTags, val]);
          setNewGlobalTagInput('');
          showToast("已新增全域自訂標籤");
        }
      };

      const removeGlobalCustomTag = (tag) => {
        if (window.confirm(`確定要刪除自訂標籤「${tag}」嗎？`)) {
          setGlobalCustomTags(globalCustomTags.filter(t => t !== tag));
          removeTagFromAllStudents(tag);
        }
      };

      const exportSettings = () => {
        const settingsToExport = {
          tagCategories,
          globalCustomTags,
          globalTopics, 
          minTimeLimit,
          maxTimeLimit,
          globalSettings
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(settingsToExport, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "演說評審系統設定.json");
        document.body.appendChild(downloadAnchorNode); 
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        showToast("設定檔已匯出！");
      };

      const handleImportSettings = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported.tagCategories) setTagCategories(imported.tagCategories);
            if (imported.globalCustomTags) setGlobalCustomTags(imported.globalCustomTags);
            
            if (imported.globalTopics) {
              setGlobalTopics(imported.globalTopics);
            } else if (imported.globalTopic) {
              setGlobalTopics([imported.globalTopic]);
            }
            
            if (imported.minTimeLimit !== undefined) setMinTimeLimit(imported.minTimeLimit);
            if (imported.maxTimeLimit !== undefined) setMaxTimeLimit(imported.maxTimeLimit);
            if (imported.globalSettings) setGlobalSettings(imported.globalSettings);
            showToast("設定檔匯入成功！");
          } catch (error) {
            alert("匯入失敗：檔案格式不正確或損毀。");
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      const getTimeStatus = (min, sec) => {
        if (min === '' && sec === '') return null;
        const totalSeconds = parseInt(min || 0) * 60 + parseInt(sec || 0);
        
        if (minTimeLimit !== '') {
          const minSeconds = parseInt(minTimeLimit) * 60;
          if (totalSeconds < minSeconds) return { status: 'error', message: `時間不足 ${minTimeLimit} 分鐘` };
        }
        
        if (maxTimeLimit !== '') {
          const maxSeconds = parseInt(maxTimeLimit) * 60;
          if (totalSeconds > maxSeconds) return { status: 'error', message: `時間超過 ${maxTimeLimit} 分鐘` };
        }
        
        return { status: 'success', message: '時間符合規定' };
      };

      const timeStatus = getTimeStatus(currentStudent.timeMin, currentStudent.timeSec);

      const exportToPDF = () => {
        const printWindow = window.open('', '_blank');
        
        let dataToPrint = studentsData.filter(s => 
          s.generatedComment || s.selectedTags.length > 0 || s.topic || s.timeMin || s.name || s.classId || s.personalExperience
        );

        if (dataToPrint.length === 0) {
          dataToPrint = studentsData;
        }

        const htmlContent = `
          <!DOCTYPE html>
          <html>
            <head>
              <title>國語演說評審記錄總表</title>
              <meta charset="utf-8">
              <style>
                body { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; padding: 20px; color: #333; }
                h1 { text-align: center; color: #1e40af; margin-bottom: 20px; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
                th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; vertical-align: top; }
                th { background-color: #f1f5f9; font-weight: bold; }
                .text-center { text-align: center; }
                .tags { color: #4f46e5; font-size: 12px; }
                .experience { color: #059669; font-size: 12px; font-style: italic; margin-top: 4px; }
                .comment { white-space: pre-wrap; line-height: 1.5; font-size: 13px; }
                @media print {
                   @page { margin: 1cm; size: landscape; }
                   body { padding: 0; }
                   .no-print { display: none; }
                }
              </style>
            </head>
            <body>
              <div class="no-print" style="background: #eff6ff; padding: 15px; text-align: center; border: 1px solid #bfdbfe; margin-bottom: 20px; border-radius: 8px;">
                <strong style="color: #1e40af;">列印提示：</strong> 請在列印對話框中，將目的地選項更改為<strong>「另存為 PDF (Save as PDF)」</strong>即可完美匯出。
                <button onclick="window.print()" style="margin-left: 15px; padding: 6px 12px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer;">立即列印 / 存為 PDF</button>
              </div>
              <h1>國語演說評審記錄總表</h1>
              <table>
                <thead>
                   <tr>
                     <th width="5%" class="text-center">座號</th>
                     <th width="6%" class="text-center">班級</th>
                     <th width="8%" class="text-center">姓名</th>
                     <th width="12%">題目</th>
                     <th width="8%" class="text-center">時間</th>
                     <th width="20%">表現點 / 自身經驗</th>
                     <th width="41%">評語</th>
                   </tr>
                </thead>
                <tbody>
                   ${dataToPrint.map(s => `
                     <tr>
                       <td class="text-center font-bold">${s.id}</td>
                       <td class="text-center">${s.classId || '-'}</td>
                       <td class="text-center font-bold">${s.name || '-'}</td>
                       <td>${s.topic || '-'}</td>
                       <td class="text-center">${s.timeMin ? s.timeMin + '分' + (s.timeSec || '0') + '秒' : '-'}</td>
                       <td>
                         <div class="tags">${s.selectedTags.join('、') || '-'}</div>
                         ${s.personalExperience ? `<div class="experience">【自身經驗】${s.personalExperience}</div>` : ''}
                       </td>
                       <td class="comment">${s.generatedComment || '-'}</td>
                     </tr>
                   `).join('')}
                </tbody>
              </table>
              <script>
                window.onload = () => { 
                   setTimeout(() => {
                     window.print(); 
                   }, 800);
                }
              <\/script>
            </body>
          </html>
        `;
        printWindow.document.write(htmlContent);
        printWindow.document.close();
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const copyToClipboard = () => {
        if (!currentStudent.generatedComment) return;
        const textArea = document.createElement("textarea");
        textArea.value = currentStudent.generatedComment;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("已複製到剪貼簿！");
        } catch (err) {
          showToast("複製失敗。");
        }
        document.body.removeChild(textArea);
      };

      const clearComment = () => {
        updateCurrentStudent({ generatedComment: '' });
      };

      // 觸發顯示 AI 版彈跳視窗
      const handleGenerateCommentClick = () => {
        setIsAiModalOpen(true);
      };

      return (
        <div className="min-h-screen p-4 sm:p-6 font-sans text-slate-800">
          
          <input 
            type="file" 
            accept=".json"
            ref={fileInputRef}
            onChange={handleImportSettings}
            className="hidden" 
          />

          {/* 套用新的 animate-fade-in-down-toast */}
          {toastMessage && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 animate-fade-in-down-toast">
              <i className="fa-solid fa-circle-check text-green-400 text-[18px]"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* AI 版防護警語彈跳視窗 - 背景改用 animate-fade-in，本體改用 animate-scale-up */}
          {isAiModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center animate-scale-up">
                <div className="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner">
                  <i className="fa-solid fa-robot"></i>
                </div>
                <h3 className="text-2xl font-bold text-slate-800 mb-2">專屬評語功能</h3>
                <p className="text-slate-600 mb-6 leading-relaxed">
                  此為靜態網頁版<br/>請使用 <strong className="text-indigo-600">AI 版工具</strong><br/>才能自動生成專屬評語！
                </p>
                <div className="flex flex-col gap-3 w-full">
                  <a 
                    href="https://gemini.google.com/share/370393e79398" 
                    target="_blank" 
                    rel="noreferrer"
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all shadow-md shadow-indigo-200 flex items-center justify-center gap-2"
                  >
                    前往 AI 版工具 <i className="fa-solid fa-arrow-up-right-from-square text-[14px]"></i>
                  </a>
                  <button 
                    onClick={() => setIsAiModalOpen(false)}
                    className="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors"
                  >
                    我知道了
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="max-w-7xl mx-auto space-y-6 flex flex-col min-h-[calc(100vh-3rem)]">
            
            <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-indigo-600 flex-shrink-0">
                  <i className="fa-solid fa-wand-magic-sparkles text-[28px]"></i>
                </div>
                <div>
                  <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                    <h1 className="text-xl sm:text-2xl font-bold text-slate-800 tracking-wide">國語演說評審記錄工具</h1>
                    <span className="bg-indigo-100 text-indigo-600 text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap">v3.1 Pro 靜態版</span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-500 mt-1">專業・高效・精準 | 專為國語文競賽評審設計</p>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-3">
                <div className="bg-white rounded-full px-4 sm:px-5 py-2 sm:py-2.5 flex items-center gap-2 sm:gap-3 shadow-sm border border-slate-100">
                  <i className="fa-solid fa-users text-indigo-400 hidden sm:block text-[18px]"></i>
                  <span className="text-sm font-medium text-slate-600">選手總數</span>
                  <span className="bg-slate-100 text-slate-800 text-sm font-bold px-3 py-1 rounded-full">{TOTAL_STUDENTS}</span>
                </div>
              </div>
            </header>

            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col gap-4">
              <div className="flex items-center gap-2 text-sm font-bold text-indigo-700 whitespace-nowrap">
                <i className="fa-solid fa-gear text-[18px]"></i> 全域比賽設定
              </div>
              
              <div className="flex flex-col lg:flex-row gap-6">
                <div className="flex flex-col gap-2">
                  <div className="flex items-center gap-1.5 text-sm text-slate-600">
                    <i className="fa-regular fa-clock text-slate-400 text-[16px]"></i>
                    <span className="font-medium">時間規範：</span>
                  </div>
                  <div className="flex items-center gap-2 text-sm">
                    <input 
                      type="number" 
                      value={minTimeLimit} 
                      onChange={e => setMinTimeLimit(e.target.value)} 
                      className="w-16 px-2 py-1.5 text-center border border-slate-200 rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-100 outline-none transition-all" 
                      min="0" 
                    />
                    <span className="text-slate-400">分</span>
                    <span className="mx-1 font-medium text-slate-500">至</span>
                    <input 
                      type="number" 
                      value={maxTimeLimit} 
                      onChange={e => setMaxTimeLimit(e.target.value)} 
                      className="w-16 px-2 py-1.5 text-center border border-slate-200 rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-100 outline-none transition-all" 
                      min="0" 
                    />
                    <span className="text-slate-400">分</span>
                  </div>
                </div>

                <div className="hidden lg:block w-px bg-slate-200 self-stretch mx-2"></div>
                <div className="block lg:hidden h-px bg-slate-200 w-full"></div>

                <div className="flex flex-col gap-2 flex-1">
                  <div className="flex items-center gap-1.5 text-sm text-slate-600">
                    <i className="fa-solid fa-tag text-slate-400 text-[16px]"></i>
                    <span className="font-medium">演說題庫 (新增後將顯示於下方選手專區供快速點選)：</span>
                  </div>
                  <div className="flex gap-2 max-w-md">
                    <input 
                      type="text" 
                      value={newTopicInput} 
                      onChange={e => setNewTopicInput(e.target.value)}
                      onKeyPress={e => e.key === 'Enter' && handleAddTopic()}
                      placeholder="輸入比賽題目..."
                      className="flex-1 px-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-100 outline-none transition-all" 
                    />
                    <button 
                      onClick={handleAddTopic}
                      className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-medium rounded-lg transition-colors border border-indigo-200"
                    >
                      新增題目
                    </button>
                  </div>
                  
                  {globalTopics.length > 0 && (
                    <div className="flex flex-wrap gap-2 mt-2">
                      {globalTopics.map(topic => (
                        <div key={topic} className="flex items-center bg-white border border-slate-300 text-slate-700 text-sm px-3 py-1.5 rounded-lg shadow-sm">
                          <span>{topic}</span>
                          <button 
                            onClick={() => handleRemoveTopic(topic)} 
                            className="ml-2 text-slate-400 hover:text-red-500 transition-colors"
                            title="刪除此題目"
                          >
                            <i className="fa-regular fa-trash-can text-[14px]"></i>
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="flex flex-col lg:flex-row gap-6 flex-1">
              
              <div className="w-full lg:w-[280px] flex-shrink-0 bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-100/50 lg:h-[calc(100vh-250px)] lg:sticky lg:top-6 overflow-y-auto custom-scrollbar">
                <h2 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                  <i className="fa-solid fa-user text-slate-400 text-[20px]"></i> 選手座號
                </h2>
                <div className="grid grid-cols-4 lg:grid-cols-3 gap-3">
                  {studentsData.map((student) => {
                    const isActive = student.id === currentId;
                    const hasComment = student.generatedComment.length > 0;
                    const hasInfo = student.name || student.classId;
                    
                    return (
                      <button
                        key={student.id}
                        onClick={() => setCurrentId(student.id)}
                        className={`flex flex-col items-center justify-center p-2 h-16 rounded-2xl transition-all relative border
                          ${isActive 
                            ? 'bg-slate-800 text-white border-slate-800 shadow-md transform scale-105 z-10' 
                            : 'bg-slate-50 text-slate-600 hover:bg-indigo-50 border-slate-100 hover:border-indigo-200'}
                        `}
                      >
                        <span className="text-lg font-bold leading-none">{student.id}</span>
                        {hasInfo && (
                          <span className={`text-[10px] mt-1 whitespace-nowrap overflow-hidden text-ellipsis w-full px-1 text-center ${isActive ? 'text-slate-300' : 'text-slate-500'}`}>
                            {student.name || student.classId}
                          </span>
                        )}
                        {hasComment && (
                          <span className={`absolute top-1.5 right-1.5 w-2 h-2 rounded-full ${isActive ? 'bg-indigo-400' : 'bg-green-400'}`}></span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="flex-1 space-y-6">
                
                <div className="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-slate-100/50">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white shadow-inner flex-shrink-0">
                        <i className="fa-solid fa-circle-user text-[28px]"></i>
                      </div>
                      <div>
                        <h2 className="text-xl sm:text-2xl font-bold text-slate-800 flex items-baseline gap-2">
                          第 {currentId} 號選手
                        </h2>
                        <p className="text-sm text-slate-500 mt-1">
                          已選取 <span className="font-bold text-indigo-600">{currentStudent.selectedTags.length}</span> 個表現點
                        </p>
                      </div>
                    </div>
                    
                    <div className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-100">
                      <input 
                        type="text" 
                        placeholder="輸入班級(選填)" 
                        value={currentStudent.classId}
                        onChange={(e) => updateCurrentStudent({ classId: e.target.value })}
                        className="w-24 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-100 outline-none"
                      />
                      <input 
                        type="text"
                        placeholder="輸入姓名(選填)" 
                        value={currentStudent.name}
                        onChange={(e) => updateCurrentStudent({ name: e.target.value })}
                        className="w-28 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-100 outline-none"
                      />
                    </div>
                  </div>

                  <div className="mb-6 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                      <span className="w-1.5 h-4 bg-indigo-500 rounded-full"></span> 選手演說題目
                    </h3>
                    {globalTopics.length > 0 ? (
                      <div className="flex flex-wrap gap-2">
                        {globalTopics.map(topic => {
                          const isSelected = currentStudent.topic === topic;
                          return (
                            <button
                              key={topic}
                              onClick={() => updateCurrentStudent({ topic: isSelected ? '' : topic })}
                              className={`px-4 py-2 rounded-xl text-sm transition-all border ${
                                isSelected
                                  ? 'bg-indigo-100 border-indigo-300 text-indigo-800 font-bold shadow-sm'
                                  : 'bg-white border-slate-200 text-slate-600 hover:bg-indigo-50 hover:border-indigo-200'
                              }`}
                            >
                              {topic}
                            </button>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="text-sm text-slate-400 italic">請先於上方「全域比賽設定」新增演說題庫，此處將顯示標籤供快速選取。</p>
                    )}
                  </div>

                  <div className="mb-8 flex flex-col sm:flex-row sm:items-center gap-4 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100">
                    <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2 sm:w-28 flex-shrink-0">
                      <span className="w-1.5 h-4 bg-indigo-500 rounded-full"></span> 演說時間
                    </h3>
                    <div className="flex items-center gap-2">
                      <input 
                        type="number" 
                        min="0" max="10"
                        value={currentStudent.timeMin}
                        onChange={(e) => updateCurrentStudent({ timeMin: e.target.value })}
                        className="w-16 sm:w-20 px-2 sm:px-3 py-2 bg-white border border-slate-200 rounded-xl text-center focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all"
                        placeholder="分"
                      />
                      <span className="text-slate-500 font-medium text-sm sm:text-base">分</span>
                      <input 
                        type="number" 
                        min="0" max="59"
                        value={currentStudent.timeSec}
                        onChange={(e) => updateCurrentStudent({ timeSec: e.target.value })}
                        className="w-16 sm:w-20 px-2 sm:px-3 py-2 bg-white border border-slate-200 rounded-xl text-center focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all"
                        placeholder="秒"
                      />
                      <span className="text-slate-500 font-medium text-sm sm:text-base">秒</span>
                    </div>
                    
                    {timeStatus && (
                      <div className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs sm:text-sm font-medium w-full sm:w-auto ${timeStatus.status === 'error' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`}>
                        {timeStatus.status === 'error' ? <i className="fa-solid fa-circle-exclamation text-[16px] flex-shrink-0"></i> : <i className="fa-solid fa-circle-check text-[16px] flex-shrink-0"></i>}
                        <span className="leading-none">{timeStatus.message}</span>
                      </div>
                    )}
                  </div>

                  <div className="space-y-8 relative">
                    <div className="flex justify-end mb-4">
                       <button 
                         onClick={() => setIsEditingTags(!isEditingTags)}
                         className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold transition-colors border ${isEditingTags ? 'bg-rose-100 text-rose-700 border-rose-200' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}`}
                       >
                         <i className="fa-regular fa-pen-to-square text-[16px]"></i> {isEditingTags ? '結束標籤管理' : '進入標籤管理模式'}
                       </button>
                    </div>

                    {tagCategories.map((category, idx) => (
                      <div key={idx}>
                        <div className="flex items-center gap-4 mb-4">
                          <h3 className="text-sm font-bold text-indigo-800 bg-indigo-50 px-4 py-1.5 rounded-full whitespace-nowrap">{category.title}</h3>
                          <div className="flex-1 h-px bg-slate-100"></div>
                        </div>
                        
                        <div className="space-y-4">
                          <div>
                            <div className="flex flex-wrap gap-2">
                             {category.strengths.map((tag, tagIdx) => {
                                const isSelected = currentStudent.selectedTags.includes(tag);
                                return (
                                  <div key={tag} className="flex items-center">
                                    <button
                                      onClick={() => toggleTag(tag)}
                                      className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm transition-all border ${
                                        isSelected && !isEditingTags
                                          ? 'bg-emerald-100 border-emerald-300 text-emerald-800 font-bold shadow-sm' 
                                          : 'bg-emerald-50/40 border-emerald-100 text-emerald-700 hover:bg-emerald-100 hover:border-emerald-200'
                                      } ${isEditingTags ? 'rounded-r-none border-r-0 cursor-default' : ''}`}
                                    >
                                      {tag}
                                    </button>
                                    {isEditingTags && (
                                      <div className="flex items-center bg-emerald-50/40 border border-emerald-100 border-l-0 rounded-r-xl h-full px-1 gap-1">
                                        <button onClick={() => handleMoveTag(idx, 'strengths', tagIdx, -1)} disabled={tagIdx === 0} className="text-slate-400 hover:text-emerald-600 disabled:opacity-30 p-1"><i className="fa-solid fa-arrow-left text-[14px]"></i></button>
                                        <button onClick={() => handleMoveTag(idx, 'strengths', tagIdx, 1)} disabled={tagIdx === category.strengths.length - 1} className="text-slate-400 hover:text-emerald-600 disabled:opacity-30 p-1"><i className="fa-solid fa-arrow-right text-[14px]"></i></button>
                                        <div className="w-px h-3 bg-emerald-200 mx-0.5"></div>
                                        <button onClick={() => handleRemoveTag(idx, 'strengths', tagIdx)} className="text-slate-400 hover:text-rose-500 p-1"><i className="fa-regular fa-trash-can text-[14px]"></i></button>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                            {isEditingTags && (
                              <div className="mt-2 flex gap-2 w-full max-w-sm">
                                 <input 
                                  type="text" 
                                  placeholder="新增優點標籤..." 
                                  value={newTagInputs[`${idx}-strengths`] || ''}
                                  onChange={(e) => setNewTagInputs(prev => ({...prev, [`${idx}-strengths`]: e.target.value}))}
                                  onKeyPress={(e) => e.key === 'Enter' && handleAddTag(idx, 'strengths')}
                                  className="flex-1 px-3 py-1.5 text-sm border border-emerald-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-400"
                                 />
                                 <button onClick={() => handleAddTag(idx, 'strengths')} className="px-3 bg-emerald-100 text-emerald-700 rounded-lg text-sm hover:bg-emerald-200"><i className="fa-solid fa-plus text-[16px]"></i></button>
                              </div>
                            )}
                          </div>

                          <div>
                            <div className="flex flex-wrap gap-2">
                              {category.weaknesses.map((tag, tagIdx) => {
                                const isSelected = currentStudent.selectedTags.includes(tag);
                                return (
                                  <div key={tag} className="flex items-center">
                                    <button
                                      onClick={() => toggleTag(tag)}
                                      className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm transition-all border ${
                                        isSelected && !isEditingTags
                                          ? 'bg-orange-100 border-orange-300 text-orange-800 font-bold shadow-sm' 
                                          : 'bg-orange-50/40 border-orange-100 text-orange-700 hover:bg-orange-100 hover:border-orange-200'
                                      } ${isEditingTags ? 'rounded-r-none border-r-0 cursor-default' : ''}`}
                                    >
                                      {tag}
                                    </button>
                                    {isEditingTags && (
                                      <div className="flex items-center bg-orange-50/40 border border-orange-100 border-l-0 rounded-r-xl h-full px-1 gap-1">
                                        <button onClick={() => handleMoveTag(idx, 'weaknesses', tagIdx, -1)} disabled={tagIdx === 0} className="text-slate-400 hover:text-orange-600 disabled:opacity-30 p-1"><i className="fa-solid fa-arrow-left text-[14px]"></i></button>
                                        <button onClick={() => handleMoveTag(idx, 'weaknesses', tagIdx, 1)} disabled={tagIdx === category.weaknesses.length - 1} className="text-slate-400 hover:text-orange-600 disabled:opacity-30 p-1"><i className="fa-solid fa-arrow-right text-[14px]"></i></button>
                                        <div className="w-px h-3 bg-orange-200 mx-0.5"></div>
                                        <button onClick={() => handleRemoveTag(idx, 'weaknesses', tagIdx)} className="text-slate-400 hover:text-rose-500 p-1"><i className="fa-regular fa-trash-can text-[14px]"></i></button>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                            {isEditingTags && (
                              <div className="mt-2 flex gap-2 w-full max-w-sm">
                                 <input 
                                  type="text" 
                                  placeholder="新增建議標籤..." 
                                  value={newTagInputs[`${idx}-weaknesses`] || ''}
                                  onChange={(e) => setNewTagInputs(prev => ({...prev, [`${idx}-weaknesses`]: e.target.value}))}
                                  onKeyPress={(e) => e.key === 'Enter' && handleAddTag(idx, 'weaknesses')}
                                  className="flex-1 px-3 py-1.5 text-sm border border-orange-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-400"
                                 />
                                 <button onClick={() => handleAddTag(idx, 'weaknesses')} className="px-3 bg-orange-100 text-orange-700 rounded-lg text-sm hover:bg-orange-200"><i className="fa-solid fa-plus text-[16px]"></i></button>
                              </div>
                            )}
                          </div>

                          {idx === 0 && (
                            <div className="mt-4 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                              <label className="block text-xs font-bold text-slate-500 mb-2 flex items-center gap-1">
                                <i className="fa-solid fa-plus text-[12px]"></i> 補充自身經驗 (供 AI 撰寫參考)
                              </label>
                              <textarea 
                               value={currentStudent.personalExperience}
                                onChange={(e) => updateCurrentStudent({ personalExperience: e.target.value })}
                                placeholder="請簡述學生演說中提到的自身經驗片段..."
                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 resize-none h-16"
                              />
                            </div>
                          )}
                       </div>
                      </div>
                    ))}

                    <div>
                      <div className="flex items-center gap-4 mb-4">
                        <h3 className="text-sm font-bold text-purple-800 bg-purple-50 px-4 py-1.5 rounded-full whitespace-nowrap">全域自訂標籤</h3>
                        <div className="flex-1 h-px bg-slate-100"></div>
                      </div>
                      
                      <div className="space-y-3">
                        {globalCustomTags.length > 0 && (
                          <div className="flex flex-wrap gap-2 mb-3">
                           {globalCustomTags.map(tag => {
                              const isSelected = currentStudent.selectedTags.includes(tag);
                              return (
                                <div key={tag} className="relative group inline-block flex items-center">
                                  <button
                                    onClick={() => toggleTag(tag)}
                                    className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm transition-all border ${
                                      isSelected && !isEditingTags
                                        ? 'bg-purple-100 border-purple-300 text-purple-800 font-bold shadow-sm' 
                                        : 'bg-purple-50/40 border-purple-100 text-purple-700 hover:bg-purple-100 hover:border-purple-200'
                                    } ${isEditingTags ? 'rounded-r-none border-r-0 cursor-default' : 'pr-8'}`}
                                  >
                                    {tag}
                                  </button>
                                  
                                  {!isEditingTags && (
                                    <button 
                                      onClick={() => removeGlobalCustomTag(tag)} 
                                      className="absolute right-2 top-1/2 -translate-y-1/2 text-purple-300 hover:text-red-500 transition-colors p-1"
                                      title="刪除此全域標籤"
                                    >
                                      <i className="fa-regular fa-trash-can text-[12px]"></i>
                                    </button>
                                  )}
                                  {isEditingTags && (
                                    <div className="flex items-center bg-purple-50/40 border border-purple-100 border-l-0 rounded-r-xl h-full px-2 gap-1">
                                      <button onClick={() => removeGlobalCustomTag(tag)} className="text-slate-400 hover:text-rose-500 p-1"><i className="fa-regular fa-trash-can text-[14px]"></i></button>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}
                        <div className="flex gap-2">
                          <input 
                            type="text" 
                            value={newGlobalTagInput}
                            onChange={(e) => setNewGlobalTagInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && addGlobalCustomTag()}
                            placeholder="輸入全域自訂關鍵字 (新增後所有選手皆可使用)..."
                            className="flex-1 px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-100 focus:border-purple-400 outline-none text-sm text-slate-700"
                          />
                          <button 
                           onClick={addGlobalCustomTag}
                            className="px-4 bg-purple-500 hover:bg-purple-600 text-white rounded-xl flex items-center justify-center transition-colors text-sm font-medium shadow-sm"
                          >
                            新增標籤
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-100/50 flex flex-col xl:flex-row xl:items-center gap-6 justify-between relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-400/10 rounded-full blur-3xl pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                  
                  <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-8 relative z-10 w-full xl:w-auto">
                    <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 w-full sm:w-auto">
                      <span className="text-sm font-bold text-slate-500 flex-shrink-0">語氣設定</span>
                      <div className="flex flex-wrap bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
                        {TONES.map(t => (
                          <button
                            key={t.id}
                            onClick={() => setGlobalSettings(prev => ({ ...prev, tone: t.id }))}
                            className={`flex-1 sm:flex-none px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all ${globalSettings.tone === t.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                          >
                            {t.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 w-full sm:w-auto">
                      <span className="text-sm font-bold text-slate-500 flex-shrink-0">字數長度</span>
                      <div className="flex flex-wrap bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
                        {LENGTHS.map(l => (
                          <button
                            key={l.id}
                            onClick={() => setGlobalSettings(prev => ({ ...prev, length: l.id }))}
                            className={`flex-1 sm:flex-none px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all ${globalSettings.length === l.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                          >
                            {l.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <button 
                    onClick={exportToPDF}
                    className={`relative z-10 w-full xl:w-auto px-6 sm:px-8 py-3.5 sm:py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-base sm:text-lg flex items-center justify-center gap-3 transition-all shadow-md shadow-indigo-200 hover:-translate-y-0.5`}
                  >
                    <i className="fa-solid fa-print text-[20px]"></i>
                    匯出 PDF 總表
                  </button>
                </div>

                <div className="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-indigo-100 relative">
                  <div className="absolute -top-4 left-4 sm:left-6 bg-indigo-600 text-white text-xs sm:text-sm font-bold px-3 sm:px-4 py-1 sm:py-1.5 rounded-full shadow-md flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-[14px]"></i> 產出結果：{currentId} 號 {currentStudent.name}
                  </div>
                  
                  <div className="mt-4 sm:mt-2">
                    {currentStudent.generatedComment ? (
                      <textarea 
                       value={currentStudent.generatedComment}
                        onChange={(e) => updateCurrentStudent({ generatedComment: e.target.value })}
                        className="w-full h-48 sm:h-56 p-4 sm:p-5 bg-indigo-50/30 border border-indigo-100 rounded-2xl focus:ring-2 focus:ring-indigo-200 outline-none text-slate-700 text-base sm:text-lg leading-relaxed resize-none transition-all"
                      />
                    ) : (
                      <div className="w-full h-48 sm:h-56 flex flex-col items-center justify-center text-slate-400 bg-slate-50 rounded-2xl border border-slate-100 border-dashed">
                        <i className="fa-solid fa-wand-magic-sparkles text-[32px] mb-3 opacity-20"></i>
                        <p className="text-sm sm:text-base">請選取標籤後點擊生成...</p>
                      </div>
                    )}
                  </div>

                  <div className="flex flex-col sm:flex-row justify-end gap-3 mt-4">
                    <button 
                      onClick={clearComment}
                     disabled={!currentStudent.generatedComment}
                      className="w-full sm:w-auto px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-medium flex items-center justify-center gap-2 transition-colors disabled:opacity-50 text-sm sm:text-base"
                    >
                      <i className="fa-regular fa-trash-can text-[18px]"></i> 清除
                    </button>
                    <button 
                      onClick={copyToClipboard}
                     disabled={!currentStudent.generatedComment}
                      className="w-full sm:w-auto px-6 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl font-medium flex items-center justify-center gap-2 transition-all disabled:opacity-50 text-sm sm:text-base"
                    >
                      <i className="fa-regular fa-copy text-[18px]"></i> 複製此筆評語
                    </button>
                  </div>
                </div>

                <div className="bg-slate-800 rounded-3xl p-4 sm:p-5 shadow-lg flex flex-col lg:flex-row lg:items-center justify-between gap-4 mt-6">
                   <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                     <button 
                       onClick={() => fileInputRef.current.click()}
                       className="flex-1 lg:flex-none justify-center bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2 transition-colors border border-slate-600"
                     >
                       <i className="fa-solid fa-file-arrow-up text-[16px]"></i> 匯入設定
                     </button>
                     <button 
                       onClick={exportSettings}
                       className="flex-1 lg:flex-none justify-center bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2 transition-colors border border-slate-600"
                     >
                       <i className="fa-solid fa-file-arrow-down text-[16px]"></i> 匯出設定
                     </button>
                     <div className="hidden lg:block w-px h-6 bg-slate-600 mx-1"></div>
                     
                     <button 
                       onClick={handleGenerateCommentClick}
                       className="w-full lg:w-auto justify-center bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors shadow-md shadow-indigo-500/20"
                     >
                       <i className="fa-solid fa-play text-[16px]"></i>
                       生成專屬評語
                     </button>
                   </div>
                   
                   <div>
                     <a 
                       href="https://gemini.google.com/share/370393e79398" 
                       target="_blank" 
                       rel="noreferrer"
                       className="inline-flex items-center gap-2 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-md shadow-emerald-500/20 w-full lg:w-auto justify-center"
                     >
                       前往 AI 版工具 <i className="fa-solid fa-arrow-up-right-from-square text-[16px]"></i>
                     </a>
                   </div>
                </div>

              </div>
            </div>

            <footer className="mt-auto pt-6 pb-4 text-center border-t border-slate-200/60">
              <div className="flex items-center justify-center gap-2 text-rose-500 font-bold text-xs sm:text-sm mb-3 bg-rose-50 inline-flex px-4 py-1.5 rounded-full">
                <i className="fa-solid fa-triangle-exclamation text-[16px]"></i>
                <span>強烈建議：使用平板請務必鎖定「螢幕方向」，以免轉動螢幕重新載入造成資料流失！可善用「匯出設定」備份標籤與題目。</span>
              </div>
              <p className="text-slate-400 text-xs sm:text-sm font-medium tracking-wide block">
                © {new Date().getFullYear()} 奕鈞老師 版權所有 | 國語文演說評審記錄工具
              </p>
            </footer>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
